<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonderly, become a happy learner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,0..100&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<!-- sticker shapes -->
<svg class="sprite">
  <defs>
    <g id="sticker-flower" fill="currentColor">
      <circle cx="50" cy="21" r="17"/>
      <circle cx="50" cy="21" r="17" transform="rotate(45 50 50)"/>
      <circle cx="50" cy="21" r="17" transform="rotate(90 50 50)"/>
      <circle cx="50" cy="21" r="17" transform="rotate(135 50 50)"/>
      <circle cx="50" cy="21" r="17" transform="rotate(180 50 50)"/>
      <circle cx="50" cy="21" r="17" transform="rotate(225 50 50)"/>
      <circle cx="50" cy="21" r="17" transform="rotate(270 50 50)"/>
      <circle cx="50" cy="21" r="17" transform="rotate(315 50 50)"/>
      <circle cx="50" cy="50" r="27"/>
    </g>
    <polygon id="sticker-burst" fill="currentColor" points="50,2 61,32 92,20 72,46 98,66 66,66 70,98 50,76 30,98 34,66 2,66 28,46 8,20 39,32"/>
    <g id="sticker-rings" fill="none" stroke="currentColor" stroke-width="8">
      <circle cx="50" cy="50" r="11"/>
      <circle cx="50" cy="50" r="27"/>
      <circle cx="50" cy="50" r="43"/>
    </g>
    <path id="sticker-squiggle" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" d="M8 64 C 18 18, 34 18, 40 50 S 58 84, 66 44 S 84 14, 93 40"/>
    <path id="sticker-spark" fill="currentColor" d="M50 4 C54 34 66 46 96 50 C66 54 54 66 50 96 C46 66 34 54 4 50 C34 46 46 34 50 4Z"/>
  </defs>
</svg>

<div id="app" v-cloak>
  <!-- header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand" v-on:click.prevent="go('home')">
        <span class="brand-mark">
          <svg class="sticker" viewBox="0 0 100 100" color="#FFD45C">
            <use href="#sticker-flower"/>
          </svg>
          <i class="fa-solid fa-star"></i>
        </span> 
        Wonderly
      </a>
      <nav class="main-nav" :class="{ open: menuOpen }">
        <button v-for="item in navItems" 
                :key="item.id" 
                class="nav-link" 
                :class="{ active: view === item.id }"
                v-on:click="go(item.id)">
          {{ item.label }}
        </button>
      </nav>
      <div class="header-actions">
        <button class="account-btn" 
                v-on:click="user ? go('profile') : openAuth('login')">
          <span class="account-avatar" v-if="user">
            {{ user.name[0] }}
          </span>
          <i class="fa-regular fa-user" v-else></i>
          <span class="account-label">
            {{ user ? user.name.split(' ')[0] : 'Log in' }}
          </span>
        </button>
        <button class="cart-btn" 
                :class="{ active: view === 'cart' }" 
                :disabled="cartCount === 0 && view !== 'cart'"
                v-on:click="toggleCart">
          <i class="fa-solid" 
              :class="view === 'cart' ? 'fa-arrow-left' : 'fa-basket-shopping'">
          </i>
          <span class="cart-label">
            {{ view === 'cart' ? 'Back to lessons' : 'Cart' }}
          </span>
          <span class="count" v-if="cartCount > 0" :key="cartCount">
            {{ cartCount }}
          </span>
        </button>
        <button class="menu-toggle" 
                v-on:click="menuOpen = !menuOpen">
          <i class="fa-solid" :class="menuOpen ? 'fa-xmark' : 'fa-bars'"></i>
        </button>
      </div>
    </div>
  </header>
</div>

      <section class="section">
        <div class="container">
          <div class="section-head row">
            <div>
              <p class="eyebrow">Class previews</p>
              <h2><span class="diamond"></span>What are they curious about?</h2>
            </div>
            <button class="btn btn-brown" v-on:click="go('explore')">All classes 
              <span class="btn-dot light"><i class="fa-solid fa-arrow-right"></i></span>
            </button>
          </div>
          <div class="category-grid">
            <button v-for="c in categories" 
                    :key="c.id" 
                    class="cat-card" 
                    :class="'cat-' + c.id" 
                    v-on:click="openCategory(c.id)">
              <svg class="sticker" viewBox="0 0 100 100" :color="categoryStyle[c.id].color">
                <use :href="'#sticker-' + categoryStyle[c.id].sticker"/>
              </svg>
              <i :class="['fa-solid', c.icon, 'cat-icon']"></i>
              <strong>{{ c.label }}</strong>
              <span>{{ c.blurb }}</span>
              <span class="arrow-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>
          </div>
        </div>
      </section>

      <section class="section" v-if="!showPicks">
        <div class="container">
          <div class="promo">
            <div>
              <p class="eyebrow">1-minute quiz</p>
              <h2>Not sure where to start?</h2>
              <p>Answer five quick questions and we will suggest the classes that match their age, interests and energy.</p>
            </div>
            <button class="btn btn-brown btn-lg" v-on:click="go('quiz')">Take the quiz 
              <span class="btn-dot light"><i class="fa-solid fa-arrow-right"></i></span>
            </button>
          </div>
        </div>
      </section>

      <section class="section tint">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow">For every age</p>
            <h2>Little explorers to future leaders</h2>
          </div>
          <div class="age-grid">
            <button class="age-card kids" v-on:click="openAge('kids')">
              <strong>6–9</strong><span>Little explorers</span><small>Play, make and discover</small>
            </button>
            <button class="age-card tweens" v-on:click="openAge('tweens')">
              <strong>10–13</strong><span>Rising creators</span><small>Build skills and confidence</small>
            </button>
            <button class="age-card teens" v-on:click="openAge('teens')">
              <strong>14–18</strong><span>Future leaders</span><small>Real-world skills for what’s next</small>
            </button>
          </div>
        </div>
      </section>
      
<script src="js/app.js"></script>
</body>
</html>
